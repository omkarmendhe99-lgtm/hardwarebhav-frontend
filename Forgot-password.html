<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Forgot Password - HardwareBhav.in</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f5f9;
    padding:15px;
}

.box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px 25px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#0f766e;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

.group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#0f766e;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#94a3b8;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>


<body>

<div class="box">

    <div class="logo">
        HardwareBhav.in
    </div>

    <div class="subtitle">
        Forgot Shop Password
    </div>


    <form id="forgotForm">

        <div class="group">

            <label>
                Registered Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10 digit mobile number"
                maxlength="10"
                inputmode="numeric"
                required
            >

        </div>


        <button
            type="submit"
            id="sendBtn"
        >
            Send OTP
        </button>


        <div id="message"></div>

    </form>


    <div class="back">

        <a href="Shop-login.html">
            ← Back to Shop Login
        </a>

    </div>

</div>


<script>

const API =
    "https://hardwarebhav-backend-uqj7.onrender.com";


document
.getElementById("forgotForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const mobile =
            document
            .getElementById("mobile")
            .value
            .trim();


        const button =
            document
            .getElementById("sendBtn");


        const message =
            document
            .getElementById("message");


        if(!/^[0-9]{10}$/.test(mobile)){

            message.innerText =
                "❌ 10 digit mobile number enter kare.";

            return;

        }


        button.disabled = true;

        button.innerText =
            "Sending OTP...";

        message.innerText =
            "Please wait...";


        /*
            OTP BACKEND NEXT STEP ME BANAYENGE
        */

        setTimeout(function(){

            button.disabled = false;

            button.innerText =
                "Send OTP";

            message.innerText =
                "⚠️ OTP system setup next step me hoga.";

        },1000);

    }
);

</script>

</body>

</html>
